[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.15

[env:esp32dev_staging]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DSMART_SAFETY_ENABLE_STAGING_NETWORK=1

[env:esp32dev_provisioner]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DSMART_SAFETY_PROVISIONER_BUILD=1
