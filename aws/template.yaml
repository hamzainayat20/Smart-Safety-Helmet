AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Smart Safety staging telemetry ingestion and private model inference.

Parameters:
  FirebaseDatabaseUrl:
    Type: String
    Description: Exact Firebase Realtime Database URL.
  ConfigurationParameterName:
    Type: String
    Description: Name of the encrypted standard SSM configuration parameter.
  GroqApiKeyParameterName:
    Type: String
    Default: /smart-safety/staging/groq-api-key
    Description: Name of the encrypted SSM SecureString containing the Groq API key.
  GroqModel:
    Type: String
    Default: openai/gpt-oss-120b
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
    Description: Groq production model ID used by the explanation assistant.
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging]

Globals:
  Function:
    Tags:
      Project: smart-safety
      Environment: !Ref EnvironmentName

Resources:
  TelemetryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [authorization, content-type]
        AllowMethods: [POST, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 1

  InferenceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: aws/inference/Dockerfile.lambda
      DockerTag: phase-c-v1
    Properties:
      FunctionName: !Sub smart-safety-${EnvironmentName}-inference
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 20

  IngestionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: aws/ingestion/Dockerfile.lambda
      DockerTag: phase-c-v1
    Properties:
      FunctionName: !Sub smart-safety-${EnvironmentName}-ingestion
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 25
      Environment:
        Variables:
          CONFIGURATION_PARAMETER_NAME: !Ref ConfigurationParameterName
          FIREBASE_DATABASE_URL: !Ref FirebaseDatabaseUrl
          INFERENCE_FUNCTION_NAME: !Ref InferenceFunction
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref InferenceFunction
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Ref ConfigurationParameterName
      Events:
        Telemetry:
          Type: HttpApi
          Properties:
            ApiId: !Ref TelemetryApi
            Method: POST
            Path: /v1/telemetry

  AssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-safety-${EnvironmentName}-assistant
      Runtime: nodejs22.x
      Architectures: [x86_64]
      CodeUri: assistant/
      Handler: handler.handler
      MemorySize: 512
      Timeout: 20
      Environment:
        Variables:
          CONFIGURATION_PARAMETER_NAME: !Ref ConfigurationParameterName
          FIREBASE_DATABASE_URL: !Ref FirebaseDatabaseUrl
          GROQ_API_KEY_PARAMETER_NAME: !Ref GroqApiKeyParameterName
          GROQ_MODEL: !Ref GroqModel
      Policies:
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Ref ConfigurationParameterName
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Ref GroqApiKeyParameterName
      Events:
        Assistant:
          Type: HttpApi
          Properties:
            ApiId: !Ref TelemetryApi
            Method: POST
            Path: /v1/assistant

  AlertActionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: aws/alert-actions/Dockerfile.lambda
      DockerTag: alert-actions-v1
    Properties:
      FunctionName: !Sub smart-safety-${EnvironmentName}-alert-actions
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 20
      Environment:
        Variables:
          CONFIGURATION_PARAMETER_NAME: !Ref ConfigurationParameterName
          FIREBASE_DATABASE_URL: !Ref FirebaseDatabaseUrl
      Policies:
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Ref ConfigurationParameterName
      Events:
        AlertViewed:
          Type: HttpApi
          Properties: {ApiId: !Ref TelemetryApi, Method: POST, Path: /v1/alerts/viewed}
        AlertAcknowledge:
          Type: HttpApi
          Properties: {ApiId: !Ref TelemetryApi, Method: POST, Path: /v1/alerts/acknowledge}
        AlertResolve:
          Type: HttpApi
          Properties: {ApiId: !Ref TelemetryApi, Method: POST, Path: /v1/alerts/resolve}
        AlertRetryDelivery:
          Type: HttpApi
          Properties: {ApiId: !Ref TelemetryApi, Method: POST, Path: /v1/alerts/retry-delivery}
        RegisterFcmToken:
          Type: HttpApi
          Properties: {ApiId: !Ref TelemetryApi, Method: POST, Path: /v1/fcm-token}
        RemoveFcmToken:
          Type: HttpApi
          Properties: {ApiId: !Ref TelemetryApi, Method: DELETE, Path: /v1/fcm-token}

  InferenceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-safety-${EnvironmentName}-inference
      RetentionInDays: 7

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-safety-${EnvironmentName}-ingestion
      RetentionInDays: 7

  AssistantLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-safety-${EnvironmentName}-assistant
      RetentionInDays: 7

  AlertActionsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-safety-${EnvironmentName}-alert-actions
      RetentionInDays: 7

Outputs:
  TelemetryEndpoint:
    Description: Signed staging telemetry endpoint. Never embed backend credentials.
    Value: !Sub https://${TelemetryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/v1/telemetry
  InferenceFunctionName:
    Value: !Ref InferenceFunction
  AssistantEndpoint:
    Description: Authenticated on-demand safety explanation endpoint.
    Value: !Sub https://${TelemetryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/v1/assistant
  AlertActionsEndpoint:
    Description: Authenticated alert actions and notification-token endpoint base.
    Value: !Sub https://${TelemetryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/v1
